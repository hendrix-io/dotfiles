# Follow the host terminal's ANSI palette, so herdr wears Ghostty's ayu theme
# (and any future theme change) without a separate herdr palette to maintain.
[theme]
name = "terminal"

[keys]
prefix = "ctrl+b"
focus_pane_left  = "prefix+h"
focus_pane_down  = "prefix+j"
focus_pane_up    = "prefix+k"
focus_pane_right = "prefix+l"
split_horizontal = "prefix+double_quote"
split_vertical    = "prefix+percent"
new_tab   = "prefix+c"
close_tab = "prefix+ampersand"
workspace_picker = "prefix+w"
goto             = "prefix+g"
copy_mode  = "prefix+y"  # herdr's copy-mode entry key; copy-mode's own internal keys (v/space select, y/Enter copy, q/Esc cancel) aren't configurable

[ui]
# Agents panel order: explicit choice of "spaces" (grouped by space, the default) over "priority".
agent_panel_sort = "spaces"

# herdr-sysmon: pin a floor wide enough for the 3-token metric rows; a short
# workspace name would otherwise narrow the sidebar and truncate them.
sidebar_min_width = 26

# herdr-sysmon sidebar rows: $sys_* tokens are pushed by the plugin's poller
# via `herdr workspace report-metadata --source sysmon`.
[ui.sidebar.spaces]
row_gap = 0
rows = [
  ["state_icon", "workspace"],
  ["branch", "git_status"],
  ["$sys_path", "$sys_zoom", "$sys_prefix"],
  ["$sys_cpu", "$sys_mem", "$sys_batt"],
  ["$sys_net", "$sys_disk"],
  ["$sys_date", "$sys_time"],
]
